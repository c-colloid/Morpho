# 署名なし ipa を GitHub Actions で作る。
#
# AltStore / SideStore は ipa を無料 Apple ID の証明書で署名し直して
# インストールするため、CI 側の署名は不要（CODE_SIGNING_ALLOWED=NO）。
# これで Apple Developer Program に加入せず、Windows 機での開発サーバも
# 経由せずに、スタンドアロンの Morpho を iPad でテストできる。
#
# 使い方（iPad だけで完結）:
#   GitHub の Actions タブ → Build IPA → Run workflow
#   → 完了後 Releases に Morpho-x.y.z.ipa が公開される（ログイン・zip 展開不要）
#   → AltStore（要 同一LAN の AltServer）か SideStore で ipa を開く
name: Build IPA

on:
  workflow_dispatch:
  # アプリ本体が変わる push で自動ビルドし、Releases を最新に保つ。
  # 文書だけの変更では走らない（バージョンバンプは app.json を触るので必ず走る）
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '!app/README.md'
      - '!app/DEVELOPMENT.md'
      - '!app/CHANGELOG.md'
      - '.github/workflows/build-ipa.yml'

# Releases への公開（タグ作成とアセット添付）に要る
permissions:
  contents: write

jobs:
  build:
    # Expo SDK 57 の ExpoModulesJSI は swift-tools-version 6.2 を要求する。
    # Xcode 16.x（Swift 6.1）だと SPM が詳細なしの
    # "Could not resolve package dependencies:" で落ちる（run #1, #2 の死因）
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Xcode を確認（26 未満なら最新を選ぶ）
        run: |
          ls /Applications | grep -i xcode || true
          MAJOR=$(xcodebuild -version | awk 'NR==1{print int($2)}')
          if [ "$MAJOR" -lt 26 ]; then
            NEWEST=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
            test -n "$NEWEST" || { echo "Xcode 26 が見つからない"; exit 1; }
            sudo xcode-select -s "$NEWEST"
          fi
          xcodebuild -version

      - name: 依存を入れる
        run: npm ci

      - name: ネイティブプロジェクトを生成 (expo prebuild)
        run: npx expo prebuild --platform ios --no-install

      - name: CocoaPods
        run: npx pod-install ios

      - name: SPM 依存を解決（実エラーを露出させる）
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace ios/Morpho.xcworkspace \
            -scheme Morpho \
            -clonedSourcePackagesDirPath SourcePackages

      - name: 署名なしでビルド
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Morpho.xcworkspace \
            -scheme Morpho \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath SourcePackages \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | xcbeautify --renderer github-actions

      - name: ipa に固める（空の .app は失敗にする）
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "app: $APP"
          test -n "$APP"
          test -f "$APP/Morpho" || { echo "実行バイナリが無い"; exit 1; }
          test -f "$APP/main.jsbundle" || echo "警告: main.jsbundle が見当たらない"
          mkdir -p Payload
          cp -R "$APP" Payload/
          VERSION=$(node -p "require('./app.json').expo.version")
          zip -qry "Morpho-${VERSION}.ipa" Payload
          SIZE=$(stat -f%z "Morpho-${VERSION}.ipa")
          echo "ipa: ${SIZE} bytes"
          test "$SIZE" -gt 3000000 || { echo "ipa が小さすぎる（ビルド不全）"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Morpho-ipa
          path: app/*.ipa
          retention-days: 14

      # Artifacts は一時保存（14日で消える・要ログイン・zip 展開が要る）なので、
      # 恒久の置き場として Releases にも公開する。iPad の Safari から直接落とせる。
      # 同じバージョンで再ビルドしたときはアセットを差し替える。
      - name: Releases に公開（main のみ）
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          TAG="v${VERSION}"
          # リリースノート: CHANGELOG の該当版の節を抜き出す（無ければ定型文）
          awk -v ver="$VERSION" '
            index($0, "## " ver " ") == 1 { hit = 1; next }
            hit && /^## / { exit }
            hit { print }
          ' CHANGELOG.md > notes.md
          if ! [ -s notes.md ]; then
            echo "Morpho ${VERSION} の署名なし ipa。AltStore / SideStore で署名し直して入れる。" > notes.md
          fi
          {
            echo ""
            echo "---"
            echo "インストール手順: https://github.com/${{ github.repository }}/blob/main/app/README.md"
          } >> notes.md
          # AltStore / SideStore の「ソース」。固定 URL
          # releases/latest/download/source.json で配るため毎リリースに添付する
          node scripts/make-source.mjs "$VERSION" "Morpho-${VERSION}.ipa" notes.md source.json
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "Morpho-${VERSION}.ipa" source.json --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "Morpho-${VERSION}.ipa" source.json \
              --title "Morpho ${VERSION}" --notes-file notes.md
          fi
