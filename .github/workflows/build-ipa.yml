# 署名なし ipa を GitHub Actions で作る。
#
# AltStore / SideStore は ipa を無料 Apple ID の証明書で署名し直して
# インストールするため、CI 側の署名は不要（CODE_SIGNING_ALLOWED=NO）。
# これで Apple Developer Program に加入せず、Windows 機での開発サーバも
# 経由せずに、スタンドアロンの Morpho を iPad でテストできる。
#
# 使い方（iPad だけで完結）:
#   GitHub の Actions タブ → Build IPA → Run workflow
#   → 完了後 Artifacts から Morpho-ipa をダウンロード → 展開
#   → AltStore（要 同一LAN の AltServer）か SideStore で ipa を開く
name: Build IPA

on:
  workflow_dispatch:
  # 検証用: このファイル自身の変更でも走る（このセッションのトークンは
  # workflow_dispatch を叩けないため）。アプリ本体の push では走らない
  push:
    branches: [main]
    paths: ['.github/workflows/build-ipa.yml']

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Xcode を確認
        run: |
          xcodebuild -version
          ls /Applications | grep -i xcode || true

      - name: 依存を入れる
        run: npm ci

      - name: ネイティブプロジェクトを生成 (expo prebuild)
        run: npx expo prebuild --platform ios --no-install

      - name: CocoaPods
        run: npx pod-install ios

      - name: SPM 依存を解決（実エラーを露出させる）
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace ios/Morpho.xcworkspace \
            -scheme Morpho \
            -clonedSourcePackagesDirPath SourcePackages

      - name: 署名なしでビルド
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Morpho.xcworkspace \
            -scheme Morpho \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath SourcePackages \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | xcbeautify --renderer github-actions

      - name: ipa に固める（空の .app は失敗にする）
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "app: $APP"
          test -n "$APP"
          test -f "$APP/Morpho" || { echo "実行バイナリが無い"; exit 1; }
          test -f "$APP/main.jsbundle" || echo "警告: main.jsbundle が見当たらない"
          mkdir -p Payload
          cp -R "$APP" Payload/
          VERSION=$(node -p "require('./app.json').expo.version")
          zip -qry "Morpho-${VERSION}.ipa" Payload
          SIZE=$(stat -f%z "Morpho-${VERSION}.ipa")
          echo "ipa: ${SIZE} bytes"
          test "$SIZE" -gt 3000000 || { echo "ipa が小さすぎる（ビルド不全）"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Morpho-ipa
          path: app/*.ipa
          retention-days: 14
