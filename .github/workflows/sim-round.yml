# iOS Simulator での自動周回（notes/development-plan-2026-09.md 3-C の機械で回せる部分）。
#
# 実機 iPad の代わりに、macOS runner の iOS Simulator（本物の WKWebView と UITextView）で
# アプリを起動し、Maestro のフロー（app/e2e/*.yaml）で受け入れ条件のうち機械で確かめられる
# 項目を通す: 起動と wasm 取得、プレビューの枚数、形式切替、ツールバー挿入でキーボードが
# 閉じないこと、テーマの列比、フッターの位置、書き出しメニュー。
# IME の変換候補・タッチの使用感・回転は対象外（実機の周回に残る）。
#
# 使い方: Actions → Simulator Round → Run workflow。成果物にスクリーンショットと Maestro のログ。
name: Simulator Round

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/e2e/**'
      - '.github/workflows/sim-round.yml'

jobs:
  sim:
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Xcode を確認（26 未満なら最新を選ぶ）
        run: |
          MAJOR=$(xcodebuild -version | awk 'NR==1{print int($2)}')
          if [ "$MAJOR" -lt 26 ]; then
            NEWEST=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
            test -n "$NEWEST" || { echo "Xcode 26 が見つからない"; exit 1; }
            sudo xcode-select -s "$NEWEST"
          fi
          xcodebuild -version

      - name: 依存を入れる
        run: npm ci

      - name: ネイティブプロジェクトを生成 (expo prebuild)
        run: npx expo prebuild --platform ios --no-install

      - name: CocoaPods
        run: npx pod-install ios

      - name: SPM 依存を解決
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace ios/Morpho.xcworkspace \
            -scheme Morpho \
            -clonedSourcePackagesDirPath SourcePackages

      - name: iPad シミュレータを選んで起動
        id: sim
        run: |
          xcrun simctl list devices available -j > devices.json
          UDID=$(node -e '
            const d = require("./devices.json").devices;
            const all = Object.entries(d).flatMap(([rt, list]) => list.map((x) => ({ ...x, rt })));
            const ipads = all.filter((x) => x.isAvailable && /iPad/.test(x.name) && /iOS/.test(x.rt));
            ipads.sort((a, b) => b.rt.localeCompare(a.rt, undefined, { numeric: true }));
            const pick = ipads.find((x) => /Pro/.test(x.name)) || ipads[0];
            if (!pick) { console.error("iPad シミュレータが無い"); process.exit(1); }
            console.error("device:", pick.name, pick.rt);
            console.log(pick.udid);
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          # ハードウェアキーボードを外す（既定は接続扱いで、ソフトキーボードもその上の
          # ツールバーも出ない。0.18.0 の確認 1 はソフトキーボードが前提）
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          open -a Simulator --args -CurrentDeviceUDID "$UDID" || true

      - name: シミュレータ向けにビルド（署名なし・Release = JS バンドル同梱）
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Morpho.xcworkspace \
            -scheme Morpho \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath SourcePackages \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | xcbeautify --renderer github-actions
          APP=$(find build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP" && test -f "$APP/Morpho"
          test -f "$APP/main.jsbundle" || { echo "main.jsbundle が無い（Metro 無しでは起動できない）"; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: アプリを入れる
        run: xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP"

      - name: Maestro を入れる
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: 診断（画面の要素木をログに出す）
        continue-on-error: true
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'
        run: |
          mkdir -p e2e-out
          UDID="${{ steps.sim.outputs.udid }}"
          for f in a-export b-editor; do
            echo "::group::diag $f"
            maestro --device "$UDID" test "e2e-diag/$f.yaml" || true
            maestro --device "$UDID" hierarchy > "e2e-out/hierarchy-$f.json" 2>/dev/null || true
            # 文字を持つ要素だけを抜いて短く出す（text / label / value と可視・座標）
            node -e '
              const fs = require("fs");
              const raw = fs.readFileSync(process.argv[1], "utf8");
              const start = raw.indexOf("{");
              if (start < 0) { console.log(raw.slice(0, 2000)); process.exit(0); }
              let root;
              try { root = JSON.parse(raw.slice(start)); } catch (e) { console.log(raw.slice(0, 4000)); process.exit(0); }
              const out = [];
              const walk = (n, depth) => {
                if (!n) return;
                const a = n.attributes || {};
                const t = a.text || a["accessibilityText"] || a.label || a.title || a.value || "";
                if (t && String(t).trim()) out.push(`${"  ".repeat(depth)}${JSON.stringify(String(t).slice(0, 60))} ${a.bounds || ""} vis=${a.visible ?? ""} ${a.resource-id || a["resource-id"] || ""}`);
                (n.children || []).forEach((c) => walk(c, depth + 1));
              };
              walk(root, 0);
              console.log(out.slice(0, 250).join("\n"));
              console.log(`(${out.length} text elements)`);
            ' "e2e-out/hierarchy-$f.json"
            echo "::endgroup::"
          done

      - name: フローを回す
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'
        run: |
          mkdir -p e2e-out
          maestro --device "${{ steps.sim.outputs.udid }}" test \
            --format junit --output e2e-out/report.xml \
            --debug-output e2e-out/debug \
            e2e

      - name: シミュレータのログ（失敗時の手がかり）
        if: always()
        run: |
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show --last 30m \
            --predicate 'process == "Morpho"' --style compact > e2e-out/app.log 2>&1 || true
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot e2e-out/final.png || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-round
          path: |
            app/e2e-out
            app/*.png
          retention-days: 14
